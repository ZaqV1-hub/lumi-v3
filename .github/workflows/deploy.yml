name: Deploy Lumi V3

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A VM é compartilhada: não sobrepor deploys nem cancelar uma troca em andamento.
concurrency:
  group: lumi-v3-rincao-deploy
  cancel-in-progress: false

jobs:
  windows-rollback:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Testar troca e retorno com servicos simulados
        shell: powershell
        run: ./tests/windows/deploy-rollback.ps1
  deploy:
    needs: windows-rollback
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi_ci
          POSTGRES_PASSWORD: lumi_ci_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumi_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Testar SQLite e PostgreSQL isolados
        run: |
          printf '%s\n' 'LUMI_TEST_POSTGRES_URL=postgresql+psycopg://lumi_ci:lumi_ci_test_only@127.0.0.1:5432/postgres' > "$RUNNER_TEMP/tests.env"
          python scripts/test-local.py --postgres-env "$RUNNER_TEMP/tests.env"
      - name: Empacotar o commit
        run: |
          python scripts/deploy_release.py package --output "$RUNNER_TEMP/lumi.zip" --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"
      - name: Publicar apenas o ambiente da branch
        env:
          DEPLOY_SSH_KEY: ${{ secrets.RINCAO_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Secret RINCAO_VM_SSH_KEY ausente neste repositório.'; exit 1; }
          latest=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Commit substituído na branch; nenhuma alteração na VM.'
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            develop) target=HML ;;
            main) target=PROD ;;
            *) exit 1 ;;
          esac
          release="gha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="C:/LumiV3-$target"
          key="$RUNNER_TEMP/lumi-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          unset DEPLOY_SSH_KEY
          opts=(-i "$key" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/rincao_known_hosts)
          remote=Administrator@vpsw2762.publiccloud.com.br
          scp -O "${opts[@]}" "$RUNNER_TEMP/lumi.zip" "$remote:$root/staging/$release.zip"
          scp -O "${opts[@]}" scripts/deploy_release.py "$remote:$root/staging/$release.py"
          scp -O "${opts[@]}" scripts/windows/deploy-release.ps1 "$remote:$root/staging/$release.ps1"
          digest=$(sha256sum "$RUNNER_TEMP/lumi.zip" | cut -d' ' -f1)
          command="& '$root/staging/$release.ps1' -Environment $target -ReleaseId $release -Commit $GITHUB_SHA -ArchiveHash $digest"
          encoded=$(printf '%s' "$command" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          ssh "${opts[@]}" "$remote" powershell -NoProfile -NonInteractive -EncodedCommand "$encoded"
          printf 'Publicado `%s` em **%s**, release `%s`.\n' "$GITHUB_SHA" "$target" "$release" >> "$GITHUB_STEP_SUMMARY"
