services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lumi_v3_dev
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente privado}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - lumi_postgres:/var/lib/postgresql/data
volumes:
  lumi_postgres:
