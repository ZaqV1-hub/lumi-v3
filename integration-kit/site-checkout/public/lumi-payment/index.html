<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Checkout Rincão Ingressos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/checkout/assets/app.css"><script type="module" src="/checkout/assets/app.js"></script></head>
<body><div class="wrap" id="checkout" data-token="__TOKEN__">
<header class="head"><div class="tenant">Rincão<small>INGRESSOS</small></div><span class="pill sec">Pagamento seguro via Cielo</span></header>
<ol class="steps" id="steps" aria-label="Etapas da compra"></ol><h1 class="title" id="title">Carregando seu pedido</h1><p class="sub" id="sub" role="status"></p>
<div class="grid" id="content" hidden><aside class="card sum" aria-label="Resumo do pedido"><details id="sumD" open>
<summary><span class="lbl" id="order"></span><span class="s-tot num" id="smallTotal"></span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M4 6l4 4 4-4"/></svg></summary>
<div><h2 id="visit"></h2><div class="summary-items" id="items"></div><div class="row total"><span>Total</span><b class="num" id="total"></b></div>
<div class="buyer"><div id="buyer"></div><div class="m num" id="cpf"></div></div><p class="testnote" id="environment"></p></div></details></aside><main id="paneHost"></main></div>
<footer class="foot"><span>Atendimento pela Lumi · tecnologia</span><img class="lg lg-l" src="/checkout/assets/lg-l.png" alt="Brevia"><img class="lg lg-d" src="/checkout/assets/lg-d.png" alt="Brevia"></footer>
</div><div class="toast" id="toast" role="status" hidden></div></body></html>
